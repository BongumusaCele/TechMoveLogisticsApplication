name: .NET Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Tests\Tests.csproj

      - name: Test
        run: dotnet test Tests\Tests.csproj --no-restore --configuration Release -p:UseSharedCompilation=false --collect:"XPlat Code Coverage"
