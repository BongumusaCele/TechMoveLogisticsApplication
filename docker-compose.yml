services:
  sql-server-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql-server-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "TechMove@12345"
      MSSQL_PID: "Developer"
    ports:
      - "14333:1433"
    volumes:
      - techmove-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - glms-network

  glms-backend-api:
    build:
      context: ..
      dockerfile: TechMoveLogisticsApplication/Dockerfile.api
    container_name: glms-backend-api
    depends_on:
      sql-server-db:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      UsePrototypeMemoryStore: "false"
      ConnectionStrings__DefaultConnection: "Server=sql-server-db,1433;Database=TechMoveDB;User Id=sa;Password=TechMove@12345;TrustServerCertificate=True;Encrypt=False"
      ApiAuthentication__ApiKey: "dev-techmove-api-key"
    ports:
      - "5014:8080"
    networks:
      - glms-network

  glms-frontend-web:
    build:
      context: ..
      dockerfile: TechMoveLogisticsApplication/Dockerfile
    container_name: glms-frontend-web
    depends_on:
      - glms-backend-api
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ApiSettings__BaseUrl: "http://glms-backend-api:8080/"
      ApiSettings__ApiKey: "dev-techmove-api-key"
    ports:
      - "8080:8080"
    networks:
      - glms-network

volumes:
  techmove-sql-data:

networks:
  glms-network:
    driver: bridge
